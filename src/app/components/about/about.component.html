<div class="legacy-project-grid">
  <article *ngFor="let project of projects" #projectCard class="legacy-project-card">
    <span class="legacy-project-index">PROJECT</span>
    <h3>{{ project.name }}</h3>
    <p>{{ project.description }}</p>
    <div class="legacy-tech-list"><span *ngFor="let tech of project.technologies">{{ tech }}</span></div>
  </article>
</div>
