<div class="skill-icon-grid">
  <article *ngFor="let skill of skills" #skillCard class="skill-card">
    <img [src]="skill.icon" [alt]="skill.name" class="skill-icon" loading="lazy">
    <div><strong>{{ skill.name }}</strong><span>{{ skill.level }}%</span></div>
    <div class="skill-meter"><i [style.width]="skill.level + '%'" aria-hidden="true"></i></div>
  </article>
</div>
