<form (ngSubmit)="sendEmail()" #contactForm="ngForm">
    <div class="mb-3">
        <label for="name" class="form-label">Nombre</label>
        <input type="text" id="name" class="form-control"
            [(ngModel)]="contactData.name" name="name" required>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" id="email" class="form-control"
            [(ngModel)]="contactData.email" name="email" required>
    </div>

    <div class="mb-3">
        <label for="message" class="form-label">Mensaje</label>
        <textarea id="message" class="form-control" rows="4"
            [(ngModel)]="contactData.message" name="message"
            required></textarea>
    </div>

    <button type="submit" class="btn colors w-100"
        [disabled]="contactForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
        {{ isLoading ? ' Enviando...' : 'Enviar Mensaje' }}
    </button>
</form>
